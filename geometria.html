<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Pitágoras, Euclides y Thales</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 25px; font-size: 1.7em; }
        .progress { text-align: center; margin-bottom: 15px; font-size: 0.95em; color: #64748b; font-weight: bold; }
        .question-box { margin-bottom: 20px; }
        .question-title { font-size: 1.12em; font-weight: bold; margin-bottom: 15px; color: #0f172a; line-height: 1.5; }
        .svg-container { text-align: center; margin: 15px 0; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .svg-container svg { max-width: 100%; height: auto; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 14px 18px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 1em; transition: all 0.2s; color: #334155; }
        .option-btn.selected { background: #e0f2fe; border-color: #0284c7; color: #0369a1; font-weight: bold; }
        .option-btn.correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; font-weight: bold; }
        .option-btn.incorrect { background: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; font-weight: bold; }
        .controls { display: flex; justify-content: flex-end; margin-top: 25px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1em; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 0.95em; line-height: 1.4; display: none; }
        .feedback.correct { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .feedback.incorrect { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }
        .results { text-align: center; display: none; }
        .results h2 { color: #1e293b; font-size: 1.8em; }
        .score { font-size: 2.5em; font-weight: bold; color: #2563eb; margin: 20px 0; }
        .results p { font-size: 1.1em; color: #475569; margin-bottom: 25px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quiz: Pitágoras, Euclides y Thales</h1>
    <div id="quiz-container">
        <div class="progress" id="progress">Pregunta 1 de 12</div>
        <div class="question-box" id="question-box"></div>
        <div class="feedback" id="feedback"></div>
        <div class="controls">
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Siguiente</button>
        </div>
    </div>
    
    <div class="results" id="results">
        <h2>¡Prueba Finalizada!</h2>
        <div class="score" id="final-score">0 / 12</div>
        <p id="result-message">Has completado el test con éxito.</p>
        <button class="btn" onclick="restartQuiz()">Reiniciar Test</button>
    </div>
</div>

<script>
const questions = [
    // --- TEOREMA DE PITÁGORAS (1 al 4) ---
    {
        question: "1. Una escalera de 10 metros de longitud está apoyada contra una pared vertical. Si la base de la escalera está a 6 metros de la pared, ¿a qué altura del suelo llega la parte superior de la escalera?",
        svg: `<svg width="200" height="160" viewBox="0 0 200 160">
            <polygon points="40,140 160,140 40,30" fill="none" stroke="#2563eb" stroke-width="3"/>
            <rect x="40" y="120" width="20" height="20" fill="none" stroke="#64748b" stroke-width="2"/>
            <text x="90" y="155" font-size="13" fill="#333" font-weight="bold">6 m</text>
            <text x="15" y="90" font-size="13" fill="#333" font-weight="bold">h = ?</text>
            <text x="105" y="75" font-size="13" fill="#2563eb" font-weight="bold">10 m</text>
        </svg>`,
        options: ["4 metros", "8 metros", "11.6 metros", "7.5 metros"],
        correct: 1, // Opción B
        explanation: "¡Correcto! Aplicando Pitágoras (h² + 6² = 10²): h² = 100 - 36 = 64  -->  h = √64 = 8 metros."
    },
    {
        question: "2. Un poste de luz vertical se rompe debido al viento. La parte superior quebrada toca el suelo a 9 metros de la base del poste. Si la parte que quedó de pie mide 12 metros, ¿cuál era la altura total original del poste?",
        svg: `<svg width="220" height="150" viewBox="0 0 220 150">
            <polygon points="40,130 180,130 40,50" fill="none" stroke="#2563eb" stroke-width="3"/>
            <rect x="40" y="110" width="20" height="20" fill="none" stroke="#64748b" stroke-width="2"/>
            <text x="100" y="145" font-size="13" fill="#333" font-weight="bold">9 m</text>
            <text x="10" y="95" font-size="13" fill="#333" font-weight="bold">12 m</text>
            <text x="120" y="80" font-size="13" fill="#2563eb" font-weight="bold">x</text>
        </svg>`,
        options: ["21 metros", "15 metros", "27 metros", "30 metros"],
        correct: 2, // Opción C
        explanation: "¡Correcto! La parte que se dobló es la hipotenusa: x = √(9² + 12²) = √(81 + 144) = √225 = 15 m. La altura total es el trozo de pie (12) más la hipotenusa (15) = 27 metros."
    },
    {
        question: "3. Una antena de televisión está afirmada por un cable tensor fijado al suelo a 5 metros de su base. Si el cable mide 13 metros de largo, ¿qué altura tiene la antena?",
        svg: `<svg width="200" height="150" viewBox="0 0 200 150">
            <polygon points="40,130 160,130 40,40" fill="none" stroke="#2563eb" stroke-width="3"/>
            <rect x="40" y="110" width="20" height="20" fill="none" stroke="#64748b" stroke-width="2"/>
            <text x="90" y="145" font-size="13" fill="#333" font-weight="bold">5 m</text>
            <text x="15" y="90" font-size="13" fill="#333" font-weight="bold">H = ?</text>
            <text x="100" y="75" font-size="13" fill="#2563eb" font-weight="bold">13 m</text>
        </svg>`,
        options: ["8 metros", "14 metros", "√194 metros", "12 metros"],
        correct: 3, // Opción D
        explanation: "¡Correcto! H² = 13² - 5² = 169 - 25 = 144  -->  H = √144 = 12 metros."
    },
    {
        question: "4. Una persona camina 8 km hacia el norte y luego 15 km hacia el este. ¿A qué distancia en línea recta se encuentra del punto de partida?",
        svg: `<svg width="180" height="150" viewBox="0 0 180 150">
            <polygon points="30,130 150,130 30,40" fill="none" stroke="#2563eb" stroke-width="3"/>
            <rect x="30" y="110" width="20" height="20" fill="none" stroke="#64748b" stroke-width="2"/>
            <text x="85" y="145" font-size="13" fill="#333" font-weight="bold">15 km</text>
            <text x="5" y="90" font-size="13" fill="#333" font-weight="bold">8 km</text>
            <text x="90" y="75" font-size="13" fill="#2563eb" font-weight="bold">d = ?</text>
        </svg>`,
        options: ["17 km", "23 km", "16.1 km", "25 km"],
        correct: 0, // Opción A
        explanation: "¡Correcto! Distancia = √(8² + 15²) = √(64 + 225) = √289 = 17 km."
    },

    // --- TEOREMAS DE EUCLIDES (5 al 8) ---
    {
        question: "5. En un triángulo rectángulo, la altura trazada hacia la hipotenusa la divide en dos segmentos de 4 cm y 9 cm. ¿Cuánto mide dicha altura?",
        svg: `<svg width="220" height="120" viewBox="0 0 220 120">
            <polygon points="20,100 200,100 90,20" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="90" y1="20" x2="90" y2="100" stroke="#dc2626" stroke-width="2"/>
            <text x="50" y="115" font-size="12" fill="#333">4 cm</text>
            <text x="135" y="115" font-size="12" fill="#333">9 cm</text>
            <text x="75" y="60" font-size="12" fill="#dc2626">h = ?</text>
        </svg>`,
        options: ["36 cm", "6 cm", "13 cm", "5 cm"],
        correct: 1, // Opción B
        explanation: "¡Correcto! Teorema de Euclides para la altura: h² = p · q = 4 · 9 = 36  -->  h = √36 = 6 cm."
    },
    {
        question: "6. En un triángulo rectángulo, la proyección de un cateto sobre la hipotenusa mide 5 cm y la longitud total de la hipotenusa es 20 cm. ¿Cuánto mide ese cateto?",
        svg: `<svg width="220" height="120" viewBox="0 0 220 120">
            <polygon points="20,100 200,100 80,20" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="80" y1="20" x2="80" y2="100" stroke="#dc2626" stroke-width="2"/>
            <rect x="80" y="85" width="15" height="15" fill="none" stroke="#64748b" stroke-width="1.5"/>
            <text x="45" y="115" font-size="12" fill="#333">p = 5</text>
            <text x="125" y="115" font-size="12" fill="#333">q = 15</text>
            <text x="40" y="60" font-size="12" fill="#2563eb">a = ?</text>
        </svg>`,
        options: ["100 cm", "15 cm", "10 cm", "√25 cm"],
        correct: 2, // Opción C
        explanation: "¡Correcto! Teorema de Euclides para el cateto: a² = c · p = 20 · 5 = 100  -->  a = √100 = 10 cm."
    },
    {
        question: "7. Si en un triángulo rectángulo los catetos miden 6 cm y 8 cm, ¿cuánto mide la proyección del cateto menor (6 cm) sobre la hipotenusa?",
        svg: `<svg width="220" height="120" viewBox="0 0 220 120">
            <polygon points="20,100 200,100 110,20" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="110" y1="20" x2="110" y2="100" stroke="#dc2626" stroke-width="2"/>
            <text x="60" y="115" font-size="11" fill="#333">p = ?</text>
            <text x="55" y="60" font-size="11" fill="#333">6 cm</text>
            <text x="145" y="60" font-size="11" fill="#333">8 cm</text>
        </svg>`,
        options: ["4.5 cm", "2.8 cm", "6 cm", "3.6 cm"],
        correct: 3, // Opción D
        explanation: "¡Correcto! La hipotenusa es c = √(6² + 8²) = 10 cm. Aplicando a² = c · p para el cateto de 6: 6² = 10 · p  -->  36 = 10p  -->  p = 3.6 cm."
    },
    {
        question: "8. En un triángulo rectángulo, la altura sobre la hipotenusa mide 6 cm y uno de los segmentos en que divide a la hipotenusa mide 3 cm. ¿Cuánto mide el otro segmento?",
        svg: `<svg width="220" height="120" viewBox="0 0 220 120">
            <polygon points="20,100 200,100 70,20" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="70" y1="20" x2="70" y2="100" stroke="#dc2626" stroke-width="2"/>
            <text x="40" y="115" font-size="11" fill="#333">3 cm</text>
            <text x="130" y="115" font-size="11" fill="#333">q = ?</text>
            <text x="75" y="60" font-size="11" fill="#dc2626">6 cm</text>
        </svg>`,
        options: ["9 cm", "12 cm", "18 cm", "2 cm"],
        correct: 1, // Opción B
        explanation: "¡Correcto! h² = p · q  -->  6² = 3 · q  -->  36 = 3q  -->  q = 12 cm."
    },

    // --- TEOREMA DE THALES (9 al 12) ---
    {
        question: "9. En el diseño de un puente, tres vigas paralelas cortan a dos avenidas secantes. En la primera avenida los tramos miden 4 m y 6 m. Si en la segunda avenida el primer tramo mide 6 m, ¿cuánto mide el segundo tramo?",
        svg: `<svg width="220" height="140" viewBox="0 0 220 140">
            <!-- Rectas paralelas horizontales -->
            <line x1="20" y1="30" x2="200" y2="30" stroke="#64748b" stroke-width="2"/>
            <line x1="20" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="2"/>
            <line x1="20" y1="130" x2="200" y2="130" stroke="#64748b" stroke-width="2"/>
            <!-- Secantes convergentes hacia arriba (formando el haz correcto de Thales) -->
            <line x1="110" y1="5" x2="30" y2="145" stroke="#2563eb" stroke-width="2.5"/>
            <line x1="110" y1="5" x2="190" y2="145" stroke="#2563eb" stroke-width="2.5"/>
            <!-- Etiquetas -->
            <text x="60" y="60" font-size="11" fill="#333" font-weight="bold">4</text>
            <text x="50" y="110" font-size="11" fill="#333" font-weight="bold">6</text>
            <text x="145" y="60" font-size="11" fill="#333" font-weight="bold">6</text>
            <text x="135" y="110" font-size="11" fill="#333" font-weight="bold">x = ?</text>
        </svg>`,
        options: ["8 metros", "10 metros", "9 metros", "7.5 metros"],
        correct: 2, // Opción C
        explanation: "¡Correcto! Por el Teorema de Thales: 4 / 6 = 6 / x  -->  4x = 36  -->  x = 9 metros."
    },
    {
        question: "10. Una línea paralela a la base de un triángulo divide a uno de sus lados en segmentos de 3 cm y 5 cm. Si el otro lado mide 16 cm en total, ¿cuánto mide el segmento menor de ese lado?",
        svg: `<svg width="180" height="160" viewBox="0 0 180 160">
            <polygon points="90,10 20,150 160,150" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="45" y1="100" x2="135" y2="100" stroke="#dc2626" stroke-width="2"/>
            <text x="50" y="70" font-size="11" fill="#333">3</text>
            <text x="35" y="130" font-size="11" fill="#333">5</text>
            <text x="105" y="75" font-size="11" fill="#333">y = ?</text>
            <text x="120" y="130" font-size="11" fill="#333">Total: 16</text>
        </svg>`,
        options: ["10 cm", "6 cm", "8 cm", "9.6 cm"],
        correct: 1, // Opción B
        explanation: "¡Correcto! La proporción es 3 / (3 + 5) = 3 / 8. Aplicando al total de 16: (3 / 8) · 16 = 6 cm."
    },
    {
        question: "11. Un árbol vertical de 4 metros de altura proyecta una sombra de 3 metros sobre el suelo horizontal. A la misma hora, un edificio proyecta una sombra de 15 metros. ¿Cuál es la altura del edificio?",
        svg: `<svg width="220" height="140" viewBox="0 0 220 140">
            <line x1="20" y1="120" x2="200" y2="120" stroke="#64748b" stroke-width="3"/>
            <line x1="50" y1="50" x2="50" y2="120" stroke="#2563eb" stroke-width="3"/>
            <line x1="140" y1="20" x2="140" y2="120" stroke="#2563eb" stroke-width="3"/>
            <text x="25" y="90" font-size="11" fill="#2563eb">4m</text>
            <text x="25" y="135" font-size="11" fill="#333">3m</text>
            <text x="110" y="70" font-size="11" fill="#2563eb">H = ?</text>
            <text x="105" y="135" font-size="11" fill="#333">15m</text>
        </svg>`,
        options: ["11.25 metros", "25 metros", "18 metros", "20 metros"],
        correct: 3, // Opción D
        explanation: "¡Correcto! Por semejanza (Thales): H / 15 = 4 / 3  -->  H = (4 / 3) · 15 = 20 metros."
    },
    {
        question: "12. En un triángulo, una transversal de gravedad o paralela divide los segmentos de un lado en razón de 2:3. Si el segmento correspondiente en el otro lado mide 12 cm, ¿cuánto mide la otra parte de ese lado?",
        svg: `<svg width="180" height="160" viewBox="0 0 180 160">
            <polygon points="90,10 20,150 160,150" fill="none" stroke="#2563eb" stroke-width="3"/>
            <line x1="45" y1="100" x2="135" y2="100" stroke="#dc2626" stroke-width="2"/>
            <text x="50" y="70" font-size="11" fill="#333">2</text>
            <text x="35" y="130" font-size="11" fill="#333">3</text>
            <text x="110" y="70" font-size="11" fill="#333">12</text>
            <text x="125" y="130" font-size="11" fill="#333">x = ?</text>
        </svg>`,
        options: ["18 cm", "8 cm", "15 cm", "20 cm"],
        correct: 0, // Opción A
        explanation: "¡Correcto! Por Thales: 2 / 3 = 12 / x  -->  2x = 36  -->  x = 18 cm."
    }
];

let currentQuestion = 0;
let score = 0;
let selectedOption = null;
let answered = false;

const questionBox = document.getElementById("question-box");
const progressEl = document.getElementById("progress");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("next-btn");
const quizContainer = document.getElementById("quiz-container");
const resultsContainer = document.getElementById("results");

function loadQuestion() {
    answered = false;
    selectedOption = null;
    feedbackEl.style.display = "none";
    feedbackEl.className = "feedback";
    nextBtn.disabled = true;
    
    const q = questions[currentQuestion];
    progressEl.innerText = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
    
    let html = `<div class="question-title">${q.question}</div>`;
    if(q.svg) {
        html += `<div class="svg-container">${q.svg}</div>`;
    }
    html += `<div class="options">`;
    q.options.forEach((opt, index) => {
        const letter = String.fromCharCode(65 + index);
        html += `<button class="option-btn" id="opt-${index}" onclick="selectOption(${index})"><strong>${letter}.</strong> ${opt}</button>`;
    });
    html += `</div>`;
    questionBox.innerHTML = html;
}

function selectOption(index) {
    if (answered) return;
    selectedOption = index;
    
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach((btn, idx) => {
        btn.classList.remove("selected");
        if (idx === index) btn.classList.add("selected");
    });
    
    answered = true;
    const q = questions[currentQuestion];
    
    buttons.forEach((btn, idx) => {
        if (idx === q.correct) {
            btn.classList.add("correct");
        } else if (idx === selectedOption && selectedOption !== q.correct) {
            btn.classList.add("incorrect");
        }
        btn.disabled = true;
    });

    if (selectedOption === q.correct) {
        score++;
        feedbackEl.className = "feedback correct";
        feedbackEl.innerHTML = `<strong>¡Correcto!</strong> ${q.explanation}`;
    } else {
        feedbackEl.className = "feedback incorrect";
        feedbackEl.innerHTML = `<strong>Incorrecto.</strong> La respuesta correcta era <strong>${String.fromCharCode(65 + q.correct)}</strong>. ${q.explanation}`;
    }
    
    feedbackEl.style.display = "block";
    nextBtn.disabled = false;
    
    if (currentQuestion === questions.length - 1) {
        nextBtn.innerText = "Ver Resultados";
    }
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    quizContainer.style.display = "none";
    resultsContainer.style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${questions.length}`;
    
    let message = "";
    const percentage = (score / questions.length) * 100;
    if (percentage === 100) {
        message = "¡Excelente! Dominas perfectamente las aplicaciones de Pitágoras, Euclides y Thales.";
    } else if (percentage >= 70) {
        message = "¡Muy buen trabajo! Tienes una sólida comprensión geométrica.";
    } else {
        message = "Te sugerimos repasar las relaciones métricas y de proporcionalidad.";
    }
    document.getElementById("result-message").innerText = message;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    nextBtn.innerText = "Siguiente";
    resultsContainer.style.display = "none";
    quizContainer.style.display = "block";
    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
